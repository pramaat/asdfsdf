spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/employee_api}
spring.datasource.username=${DATABASE_USERNAME:employee_api}
spring.datasource.password=${DATABASE_PASSWORD}
spring.sql.init.mode=always
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
app.kafka.employee-events-topic=${EMPLOYEE_EVENTS_TOPIC:employee-events}
app.employee-store=${EMPLOYEE_STORE:postgres}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/employee_api}
app.crypto.provider=${EMPLOYEE_CRYPTO_PROVIDER:local}
app.crypto.local-key=${EMPLOYEE_LOCAL_ENCRYPTION_KEY:}
app.crypto.aws-kms-key-id=${EMPLOYEE_KMS_KEY_ID:}
app.database-credentials.provider=${DATABASE_CREDENTIALS_PROVIDER:environment}
app.database-credentials.secret-id=${DATABASE_CREDENTIALS_SECRET_ID:}
